<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MotionForge · Charte du logo</title>
<link rel="icon" href="logo/favicon.svg">
<style>
:root{--ink:#0E0E12;--orange:#FF6A1A;--cream:#F6F1E7;--gold:#E8B04B}
body{margin:0;background:#1a1a20;color:var(--cream);font:15px/1.5 system-ui,sans-serif;padding:32px 16px;max-width:1200px;margin:auto}
h1{font-size:24px;margin:0 0 4px}h2{font-size:17px;color:var(--orange);margin:36px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.card{border-radius:14px;padding:20px;display:flex;align-items:center;justify-content:center;min-height:120px}
.d{background:var(--ink)}.l{background:var(--cream)}.photo{background:linear-gradient(135deg,#3b6e8f,#c46b3e)}
.card img{max-width:100%;max-height:140px}
.sw{display:flex;gap:12px;flex-wrap:wrap}.sw div{width:130px;border-radius:12px;padding:70px 12px 10px;font-size:13px}
.sizes{display:flex;gap:20px;align-items:end;flex-wrap:wrap}
.round{border-radius:50%;width:160px}
small{opacity:.7}
</style></head><body>
<h1>MotionForge · Logo « Play forgé »</h1><small>Lecture + vitesse + étincelle de forge</small>
<h2>Logo horizontal</h2>
<div class="grid"><div class="card d"><img src="logo/motionforge-horizontal-sombre-transparent.svg"></div><div class="card l"><img src="logo/motionforge-horizontal-clair-transparent.svg"></div>
<div class="card d"><img src="logo/motionforge-horizontal-court-sombre.svg"></div><div class="card l"><img src="logo/motionforge-horizontal-court-clair.svg"></div></div>
<h2>Monochrome (filigrane des vidéos, impression)</h2>
<div class="grid"><div class="card photo"><img src="logo/motionforge-mono-blanc.svg"></div><div class="card l"><img src="logo/motionforge-mono-noir.svg"></div></div>
<h2>Icône, photo de profil, favicon</h2>
<div class="sizes"><img class="round" src="png/motionforge-profil-1080.png"><img width="120" src="png/motionforge-icone-512.png"><img width="64" src="png/apple-touch-icon.png"><img src="png/favicon-48.png"><img src="png/favicon-32.png"><img src="png/favicon-16.png"></div>
<h2>Couleurs</h2>
<div class="sw"><div style="background:#0E0E12;border:1px solid #333">Noir forge<br>#0E0E12</div><div style="background:#FF6A1A;color:#0E0E12">Orange forge<br>#FF6A1A</div><div style="background:#F6F1E7;color:#0E0E12">Crème<br>#F6F1E7</div><div style="background:#E8B04B;color:#0E0E12">Étincelle<br>#E8B04B</div></div>
</body></html>
